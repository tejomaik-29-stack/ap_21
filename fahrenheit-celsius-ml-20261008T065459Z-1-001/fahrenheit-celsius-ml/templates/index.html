<!DOCTYPE html>
<html>

<head>
    <title>Fahrenheit to Celsius ML/DL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <h1>Fahrenheit to Celsius</h1>
    <p>Machine Learning and Deep Learning Prediction</p>

    <label>Fahrenheit:</label>
    <input type="number" id="fahrenheit" value="212">

    <br><br>

    <label>Select Model:</label>
    <select id="model">
        <option value="ml">Machine Learning</option>
        <option value="dl">Deep Learning</option>
    </select>

    <br><br>

    <button onclick="predict()">Predict</button>

    <h2 id="result">Result will appear here</h2>

    <script>
        async function predict() {
            const fahrenheit = document.getElementById("fahrenheit").value;
            const model = document.getElementById("model").value;

            const response = await fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({fahrenheit: fahrenheit, model: model})
            });

            const data = await response.json();

            document.getElementById("result").innerHTML =
                "Model: " + data.model + "<br>" +
                "Fahrenheit: " + data.fahrenheit + "<br>" +
                "Celsius: " + data.celsius.toFixed(2);
        }
    </script>

</body>
</html>
